# nginx 在這裡只做一件事：把一包靜態檔送出去。沒有反向代理——
# API 是瀏覽器自己去打 trading-board-api 的，不經過這裡。

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 非 root 的映像檔寫不了預設的暫存目錄，全部指到 /tmp。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # 探針打這裡：它不會被下面 SPA 的 fallback 接走，否則任何路徑都回 200，
        # 探針就分不出服務壞了沒。
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 指紋化的資產（檔名含 hash）可以長期快取。
        location /_nuxt/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # HTML 不快取：舊的 HTML 指向已被刪掉的 _nuxt 檔名，畫面會直接白掉。
        location / {
            add_header Cache-Control "no-cache";
            # /history/<交易日> 這種路徑在磁碟上沒有對應檔案，交給 200.html
            # （同一個 SPA 外殼），由前端的 router 解析。
            try_files $uri $uri/index.html /200.html;
        }
    }
}
