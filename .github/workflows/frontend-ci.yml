# Trading Board 前端的 CI/CD：lint → 測試 → 建置映像檔推 GHCR → 把版本號寫回 go-trading-deploy，
# 由 Argo CD 套用。照 go-trading-frontend 的 ci.yml，差別只在這是 monorepo：
#   - 只在 frontend/** 有變動時跑（後端有自己的 workflow）；
#   - 所有指令在 frontend/ 底下執行；
#   - 映像檔名寫死成 trading-board-frontend，不用 github.repository（那是整個 repo 的名字）。

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# 同一條分支的第二次 push 會讓第一次的答案失去意義。
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/codemachine0121/trading-board-frontend

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # 版本從 package.json 的 packageManager 讀，不在這裡寫第二份。
          bun-version-file: frontend/package.json

      - name: cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile：lockfile 與 package.json 對不起來就失敗，而不是安靜地裝別的版本。
      # postinstall 的 `nuxt prepare` 會產生 .nuxt/，eslint 與 typecheck 都要它。
      - name: install
        run: bun install --frozen-lockfile

      # 拆開跑：失敗的那一格自己會說是哪一關壞了。
      - name: eslint
        run: bun run lint

      - name: stylelint
        run: bun run lint:style

      - name: design tokens
        run: bun run lint:tokens

      - name: typecheck
        run: bun run typecheck

      # 一定要 `bun run test`——`bun test` 會改跑 bun 內建的 runner，不是 Vitest。
      - name: test
        run: bun run test:coverage

      # 靜態輸出建得起來（映像檔裡做的就是這一步）。
      - name: build
        run: bun run generate

  publish:
    needs: verify

    # Pull request 不會走到這裡：fork 的 PR 不該有機會把映像檔放到這個名字底下。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: read
      # 有了它，內建的 token 就推得了 GHCR，不必另外保存 registry 密碼。
      packages: write

    steps:
      - uses: actions/checkout@v5

      # 版本號只算一次：推上去的標籤與寫回部署的標籤必須是同一個值。
      - id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 正式板子的網址烤進 bundle（見 frontend/Dockerfile）。
          build-args: |
            NUXT_PUBLIC_API_BASE_URL=https://trading-board-api.coding-afternoon.com/api/v1
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trading-board-frontend
          cache-to: type=gha,mode=max,scope=trading-board-frontend

  # 舊版本沒有別的東西會刪，私有套件的空間有限。留五版以便回退。
  prune:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: trading-board-frontend
          package-type: container
          min-versions-to-keep: 5

  # 最後一環：在部署 repo 裡把版本號改成這一次，Argo CD 只讀 git。
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          repository: CodeMachine0121/go-trading-deploy
          # 只認得那一個 repository 的 deploy key（需在本 repo 的 secrets 設定）。
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          ref: main
          fetch-depth: 0

      - name: Point the deployment at this commit
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          # 走環境變數，絕不內插進腳本：commit message 是別人寫的文字。
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # yq 設定的是「名字等於這個映像檔的那一項」的 newTag，不是剛好長得對的那一行。
          yq -i "(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)" \
            trading-board-frontend/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trading-board-frontend/kustomization.yaml
          if git diff --cached --quiet; then
            echo "deployment already points at $TAG"
            exit 0
          fi

          SUBJECT=$(printf '%s\n' "$SOURCE_MESSAGE" | head -1)
          git commit -m "Deploy trading-board-frontend $TAG" \
                     -m "${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "$SUBJECT"

          # 好幾個服務寫同一個 repository：被拒就 rebase 重試，不 force。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused, rebasing onto what landed first (attempt $attempt)"
            git pull --rebase
          done

          echo "::error::could not write the deployment update after three attempts"
          exit 1
